<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Diablo II — Bảng tỷ lệ quái và công trình</title>
<style>
  body { margin:0; padding:32px; background:#0d0b0a; color:#d8cbb3; font:14px/1.5 "Segoe UI", "Noto Sans", sans-serif; }
  h1 { margin:0 0 4px; font-size:22px; color:#c7b377; font-weight:600; }
  .sub { color:#8c7f6a; font-size:13px; margin-bottom:16px; }
  svg { width:100%; height:auto; display:block; background:#17130f; border:1px solid #3a2f24; border-radius:8px; }
</style>
</head>
<body>
<h1>Bảng tỷ lệ — quái và công trình</h1>
<div class="sub">1 H = chiều cao hero = 75 px. Silhouette là sơ đồ minh họa, không phải thiết kế.</div>
<svg id="chart" viewBox="0 0 1080 380"></svg>
<script>
const H = 75, ground = 330, svg = document.getElementById("chart");
const ns = "http://www.w3.org/2000/svg";
const el = (t, a) => { const e = document.createElementNS(ns, t); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; };
for (let i = 0; i <= 4; i++) {
  const y = ground - i * H;
  el("line", { x1: 40, x2: 1070, y1: y, y2: y, stroke: i ? "#3a2f24" : "#6a5a44", "stroke-dasharray": i ? "4 4" : "" });
  el("text", { x: 8, y: y + 4, fill: "#8c7f6a", "font-size": 12 }).textContent = i + "H";
}
const figs = [
  { n: "XS", d: "0.35H", h: .35, w: .45, x: 80, kind: "beast", c: "#6b5a48" },
  { n: "S", d: "0.65H", h: .65, w: .4, x: 150, kind: "imp", c: "#8a4a3a" },
  { n: "HERO", d: "1H", h: 1, w: .32, x: 225, kind: "man", c: "#c7b377" },
  { n: "M", d: "1H", h: 1, w: .34, x: 295, kind: "man", c: "#6e7a62" },
  { n: "L", d: "1.45H", h: 1.45, w: .7, x: 390, kind: "brute", c: "#7a6a5a" },
  { n: "XL", d: "2H", h: 2, w: .95, x: 510, kind: "brute", c: "#6a3a2a" },
  { n: "BOSS", d: "2.8H", h: 2.8, w: 1.1, x: 650, kind: "boss", c: "#8a2a2a" },
];
function figure(f) {
  const h = f.h * H, w = f.w * H, x = f.x, top = ground - h;
  const g = { fill: f.c };
  if (f.kind === "beast") {
    el("ellipse", { cx: x, cy: ground - h * .45, rx: w / 2, ry: h * .45, ...g });
    el("circle", { cx: x + w * .45, cy: ground - h * .6, r: h * .3, ...g });
  } else if (f.kind === "imp") {
    el("rect", { x: x - w * .35, y: top + h * .38, width: w * .7, height: h * .45, rx: 6, ...g });
    el("circle", { cx: x, cy: top + h * .22, r: h * .22, ...g });
    el("rect", { x: x - w * .3, y: ground - h * .2, width: w * .2, height: h * .2, ...g });
    el("rect", { x: x + w * .1, y: ground - h * .2, width: w * .2, height: h * .2, ...g });
  } else if (f.kind === "man") {
    el("circle", { cx: x, cy: top + h * .08, r: h * .08, ...g });
    el("rect", { x: x - w / 2, y: top + h * .17, width: w, height: h * .4, rx: 4, ...g });
    el("rect", { x: x - w / 2, y: top + h * .57, width: w * .42, height: h * .43, ...g });
    el("rect", { x: x + w * .08, y: top + h * .57, width: w * .42, height: h * .43, ...g });
  } else if (f.kind === "brute") {
    el("path", { d: `M${x - w / 2} ${ground - h * .3} Q${x - w / 2} ${top + h * .1} ${x} ${top + h * .05} Q${x + w / 2} ${top + h * .1} ${x + w / 2} ${ground - h * .3} Z`, ...g });
    el("circle", { cx: x + w * .1, cy: top + h * .15, r: h * .09, ...g });
    el("rect", { x: x - w * .35, y: ground - h * .32, width: w * .25, height: h * .32, ...g });
    el("rect", { x: x + w * .1, y: ground - h * .32, width: w * .25, height: h * .32, ...g });
    el("rect", { x: x - w * .62, y: top + h * .25, width: w * .14, height: h * .55, rx: 5, ...g });
  } else {
    el("path", { d: `M${x - w * .3} ${ground} L${x - w * .15} ${top + h * .35} L${x - w * .55} ${top + h * .05} L${x - w * .1} ${top + h * .2} L${x} ${top} L${x + w * .1} ${top + h * .2} L${x + w * .55} ${top + h * .05} L${x + w * .15} ${top + h * .35} L${x + w * .3} ${ground} Z`, ...g });
  }
  el("text", { x, y: ground + 20, fill: "#d8cbb3", "font-size": 13, "text-anchor": "middle", "font-weight": 600 }).textContent = f.n;
  el("text", { x, y: ground + 36, fill: "#8c7f6a", "font-size": 11, "text-anchor": "middle" }).textContent = f.d;
}
figs.forEach(figure);
// structures
const sx = 780;
el("rect", { x: sx, y: ground - 1.4 * H, width: 46, height: 1.4 * H, fill: "#0a0807", stroke: "#8c7f6a" });
el("text", { x: sx + 23, y: ground + 20, fill: "#d8cbb3", "font-size": 13, "text-anchor": "middle", "font-weight": 600 }).textContent = "Cửa";
el("text", { x: sx + 23, y: ground + 36, fill: "#8c7f6a", "font-size": 11, "text-anchor": "middle" }).textContent = "1.3–1.5H";
el("rect", { x: 875, y: ground - 2 * H, width: 40, height: 2 * H, fill: "#4a4038" });
el("text", { x: 895, y: ground + 20, fill: "#d8cbb3", "font-size": 13, "text-anchor": "middle", "font-weight": 600 }).textContent = "Tường trong";
el("text", { x: 895, y: ground + 36, fill: "#8c7f6a", "font-size": 11, "text-anchor": "middle" }).textContent = "1.5–2H";
el("rect", { x: 985, y: ground - .5 * H, width: 50, height: .5 * H, fill: "#4a4038", opacity: .6 });
el("text", { x: 1010, y: ground + 20, fill: "#d8cbb3", "font-size": 13, "text-anchor": "middle", "font-weight": 600 }).textContent = "Tường trước";
el("text", { x: 1010, y: ground + 36, fill: "#8c7f6a", "font-size": 11, "text-anchor": "middle" }).textContent = "≤ 0.5H";
</script>
</body>
</html>
