<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{background:transparent;margin:0}
body{color:var(--foreground);font-family:var(--font-sans)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.name{font-weight:600;margin:0 0 6px;color:var(--foreground)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
figure{margin:0;min-width:0}
.fr{display:flex;align-items:center;justify-content:center;aspect-ratio:2/3;border:1px solid var(--border);border-radius:var(--radius)}
.fr img{max-width:100%;max-height:100%;object-fit:contain;display:block}
figcaption{font-size:12px;margin-top:4px;color:var(--foreground);opacity:.75}
</style></head><body>
<div class="row">
<section><p class="name">Gennet Barrow</p><div class="pair">
<figure><div class="fr"><img alt="Gennet Barrow concept A" src="E:/Diablo2/ashlar/art/npcs/N01_gennet-barrow/concept_A_r2.png"></div><figcaption>A</figcaption></figure>
<figure><div class="fr"><img alt="Gennet Barrow concept B" src="E:/Diablo2/ashlar/art/npcs/N01_gennet-barrow/concept_B_r2.png"></div><figcaption>B</figcaption></figure>
</div></section>
<section><p class="name">Zorya</p><div class="pair">
<figure><div class="fr"><img alt="Zorya concept A" src="E:/Diablo2/ashlar/art/npcs/N28_zorya/concept_A.png"></div><figcaption>A</figcaption></figure>
<figure><div class="fr"><img alt="Zorya concept B" src="E:/Diablo2/ashlar/art/npcs/N28_zorya/concept_B_v2.png"></div><figcaption>B</figcaption></figure>
</div></section>
</div>
</body></html>
